<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d81f26"/>
      <stop offset="1" stop-color="#8f1016"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="150" cy="150" r="78"/></clipPath>
  </defs>
  <rect width="1000" height="300" fill="#ffffff"/>

  <!-- Lens icon -->
  <circle cx="150" cy="150" r="120" fill="#14171c"/>
  <circle cx="150" cy="150" r="104" fill="none" stroke="url(#red)" stroke-width="14"/>
  <circle cx="150" cy="150" r="78" fill="#ffffff"/>

  <!-- news columns inside the lens -->
  <g clip-path="url(#inner)">
    <rect x="92" y="96" width="116" height="14" rx="3" fill="#14171c"/>
    <rect x="92" y="122" width="52" height="40" rx="3" fill="url(#red)"/>
    <rect x="154" y="124" width="54" height="7" rx="3" fill="#14171c"/>
    <rect x="154" y="140" width="54" height="7" rx="3" fill="#14171c"/>
    <rect x="154" y="156" width="40" height="7" rx="3" fill="#14171c"/>
    <rect x="92" y="174" width="116" height="7" rx="3" fill="#9aa0aa"/>
    <rect x="92" y="190" width="96" height="7" rx="3" fill="#9aa0aa"/>
  </g>

  <!-- lens glare -->
  <path d="M 98 112 A 62 62 0 0 1 150 88" fill="none" stroke="#ffffff" stroke-opacity=".0" stroke-width="6"/>
  <path d="M 62 105 A 100 100 0 0 1 120 55" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="300" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" letter-spacing="10" fill="#b3141b">THE</text>
  <text x="296" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="bold" fill="#14171c">Daily Lens</text>
  <rect x="300" y="268" width="64" height="6" fill="#b3141b"/>
  <text x="378" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#6b7280">YOUR FOCUSED DAILY NEWS</text>
</svg>
